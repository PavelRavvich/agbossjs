name: CI

on:
  pull_request:
    branches: [dev, staging, production]
  push:
    branches: [dev, staging, production]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
      # the GitHub Wiki is docs too (#240): its ts blocks compile, its commands and links exist
      - uses: actions/checkout@v5
        with:
          repository: agbossjs/agboss.wiki
          path: wiki
      - run: node scripts/check-docs.mjs --wiki wiki
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage-badge.cjs packages/agboss/coverage/coverage-summary.json > /tmp/coverage.json
          cd "$(mktemp -d)"
          git init -q -b badges
          cp /tmp/coverage.json .
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
